<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aegis Safety Guard</title>
  <style>
    body { width: 300px; background: #0A0A0A; color: #00FF66; font-family: monospace; padding: 16px; box-sizing: border-box; }
    h3 { margin-top: 0; font-size: 13px; letter-spacing: 1px; border-b: 1px solid #222; padding-bottom: 8px; }
    .row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: #aaa; }
    input[type="range"] { width: 100%; accent-color: #00FF66; cursor: pointer; }
    .status { background: #141414; padding: 8px; border-radius: 4px; border: 1px solid #222; margin-top: 12px; font-size: 10px; }
  </style>
</head>
<body>
  <h3>🛡️ AEGIS SAFETY GUARD</h3>
  <div class="row">
    <span>BLUR RADIUS</span>
    <strong id="blur-val">15px</strong>
  </div>
  <input type="range" id="blur-radius-slider" min="0" max="50" value="15" />

  <div class="status">
    DOM OVERLAY: <span style="color:#00FF66;">ACTIVE</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
